[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.8"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8.6", features = [
    "runtime-tokio",
    "postgres",
    "uuid",
    "macros",
    "migrate"
] }
uuid = { version = "1", features = ["v4", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
argon2 = "0.5"
jsonwebtoken = "10.3.0"
rand = "0.10.0"
time = "0.3"
axum-extra = { version = "0.12.5", features = ["cookie"] }
sha2 = "0.10"
hex = "0.4"
anyhow = "1.0.102"
